<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>539 AI 智慧預測</title>
<style>
body{
font-family:Arial,sans-serif;
background:#eef3f8;
text-align:center;
padding:15px;
}
h1{color:#174c76}
.card{
background:white;
padding:20px;
margin:15px auto;
border-radius:15px;
max-width:500px;
box-shadow:0 3px 10px #ccc;
}
.ball{
display:inline-block;
background:#e53935;
color:white;
border-radius:50%;
width:45px;
height:45px;
line-height:45px;
margin:4px;
font-weight:bold;
}
button{
background:#1769aa;
color:white;
padding:13px 22px;
border:0;
border-radius:10px;
font-size:17px;
}
</style>
</head>
<body>

<h1>🎯 539 AI 智慧預測</h1>

<div class="card">
<h2>最新開獎號碼</h2>
<p id="latest">尚未連接開獎資料</p>
</div>

<div class="card">
<h2>下一期 AI 參考號碼</h2>
<div id="result"></div>
<br>
<button onclick="predict()">產生5組號碼</button>
</div>

<div class="card">
<h2>統計分析</h2>
<p>熱門號碼分析</p>
<p>冷門號碼分析</p>
<p>奇偶比例分析</p>
<p>歷史開獎走勢</p>
<p>（等待歷史資料連接）</p>
</div>

<script>
function predict(){
let html="";
for(let j=0;j<5;j++){
let nums=[];
while(nums.length<5){
let n=Math.floor(Math.random()*39)+1;
if(!nums.includes(n))nums.push(n);
}
nums.sort((a,b)=>a-b);
html+="<p>第"+(j+1)+"組<br>";
nums.forEach(n=>{
html+="<span class='ball'>"+
String(n).padStart(2,"0")+"</span>";
});
html+="</p>";
}
document.getElementById("result").innerHTML=html;
}
predict();
</script>

<p>⚠️ 選號僅供參考，不保證中獎。</p>

</body>
</html>
