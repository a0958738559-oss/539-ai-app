
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>539 AI 預測 App</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101c35;
  color: white;
  text-align: center;
  padding: 20px;
}
h1 { color: #ffd700; }
.card {
  background: #243653;
  padding: 20px;
  margin: 15px 0;
  border-radius: 15px;
}
button {
  background: #ffd700;
  border: none;
  border-radius: 10px;
  padding: 15px;
  font-size: 18px;
}
.num {
  display: inline-block;
  background: #ffcc00;
  color: black;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  line-height: 45px;
  margin: 3px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🎯 539 AI 預測 App</h1>

<div class="card">
<h2>最新開獎號碼</h2>
<p>尚未連接官方開獎資料</p>
</div>

<div class="card">
<h2>下一期參考號碼</h2>
<div id="result"></div>
<br>
<button onclick="predict()">產生5組參考號碼</button>
</div>

<div class="card">
<h2>歷史統計分析</h2>
<p>等待匯入歷史開獎資料</p>
</div>

<p>提醒：號碼為隨機參考，不保證中獎。</p>

<script>
function predict() {
  let html = "";
  for (let i = 0; i < 5; i++) {
    let numbers = [];
    while (numbers.length < 5) {
      let n = Math.floor(Math.random() * 39) + 1;
      if (!numbers.includes(n)) numbers.push(n);
    }
    numbers.sort((a,b) => a-b);
    html += "<p>第" + (i+1) + "組</p>";
    numbers.forEach(n => {
      html += '<span class="num">' +
        String(n).padStart(2,"0") + '</span>';
    });
  }
  document.getElementById("result").innerHTML = html;
}
predict();
</script>

</body>
</html>
