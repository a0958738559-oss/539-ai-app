name: 539 Daily Update

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show update time
        run: |
          echo "539 每日更新排程"
          TZ=Asia/Taipei date
